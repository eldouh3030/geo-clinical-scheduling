# Template for an experiment with new privacy rules or security costs.
# Copy this file, give it a new name, and list the rules / overheads you added in
# extensions.py. Keep workloads, loads, reference and policies unchanged so that the
# results can be compared directly with final-raw, final-federated and final-residency.
name: final-security-example
workloads: [base-s1, base-s2, base-s3, base-s4, base-s5, base-s6, base-s7, base-s8, base-s9, base-s10]
simulator: {cache_fraction: 0.15, replicas: [], decompose: true, coordinator: cloud, merge_ms: 1.0,
            rules: [residency],          # rule names, e.g. [residency, min-group-10]
            overheads: [],               # per-byte costs, e.g. [aes-gcm]
            session_costs: []}           # once-per-connection costs, e.g. [tls13]
seed: 1
parallel: 4
reference: {policy: delay, window: 16, local_threshold: 0.8, delay_s: 0.5}
reference_simulator: {cache_fraction: 0.15, replicas: [], decompose: false}
loads: [0.3, 0.6, 0.9, 1.5, 2.5]
policies:
  - {policy: hash}
  - {policy: fifo}
  - {policy: delay, window: 16, local_threshold: 0.8, delay_s: 0.5}
  - {policy: wanaware}
  - {policy: flow, window: 64, gamma: 1.0, retry_s: 0.05}
